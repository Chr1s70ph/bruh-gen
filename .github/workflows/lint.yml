name: Lint Shell Scripts

on:
  pull_request:
    branches:
      - main
      - master
jobs: 
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          files: '**/*.sh'
